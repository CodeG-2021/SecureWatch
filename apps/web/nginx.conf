server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # JS/CSS assets have hashed filenames — cache them aggressively
    location ~* \.(js|css|woff2?|ttf|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached so browser picks up new asset hashes
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
