name: securewatch

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    container_name: securewatch-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - securewatch

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: securewatch-api-gateway
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-securewatch}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-8080}
      API_GATEWAY_REQUIRE_AUTH: ${API_GATEWAY_REQUIRE_AUTH:-true}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,X-Request-ID}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - securewatch

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: securewatch-auth-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-8081}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://${POSTGRES_USER:-securewatch}:${POSTGRES_PASSWORD:-securewatch}@postgres:5432/${POSTGRES_DB:-securewatch}?sslmode=disable
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securewatch

  postgres:
    image: postgres:16-alpine
    container_name: securewatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securewatch}
      POSTGRES_USER: ${POSTGRES_USER:-securewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securewatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securewatch} -d ${POSTGRES_DB:-securewatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securewatch

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: securewatch-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-securewatch}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-securewatch}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securewatch

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: securewatch-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-securewatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-securewatch123}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securewatch

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: securewatch-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-securewatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-securewatch123}
      MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE:-securewatch-evidence}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-securewatch-reports}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-securewatch-artifacts}
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    volumes:
      - ./infra/docker/minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    networks:
      - securewatch
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: securewatch-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - securewatch

  grafana:
    image: grafana/grafana:11.2.0
    container_name: securewatch-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - securewatch

networks:
  securewatch:
    name: securewatch-local
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
